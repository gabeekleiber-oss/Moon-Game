name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget
      - name: Run full headless suite
        run: bash scripts/tools/run_tests.sh
