name: Windows Godot tests
on:
  push:
    branches: [main, scaffolding/experience-build-method]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# New commits supersede older test runs on the same PR/branch; do not waste runners on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  headless-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run contract and Godot headless tests
        shell: pwsh
        run: ./scripts/tools/run_tests.ps1
